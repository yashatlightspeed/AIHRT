version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: aihrt_postgres
    environment:
      POSTGRES_USER: aihrt
      POSTGRES_PASSWORD: aihrt_password
      POSTGRES_DB: aihrt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihrt -d aihrt_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aihrt_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aihrt:aihrt_password@db:5432/aihrt_db
      AUDIO_STORAGE_DIR: /app/audio_storage
    ports:
      - "8000:8000"
    volumes:
      - audio_storage:/app/audio_storage
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aihrt_frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
  audio_storage:
